## SonarCloud configuration for polymarket-trading-bot-3.21.26
##
## Setup steps (one-time, manual via SonarCloud UI):
##   1. Go to https://sonarcloud.io/projects/create and choose "Import an organization from GitHub"
##   2. Authorize SonarCloud against udt1234's GitHub account
##   3. Pick this repo (polymarket-trading-bot-3.21.26)
##   4. Choose "With GitHub Actions" as the analysis method
##   5. Copy the SONAR_TOKEN secret SonarCloud generates and add it to GitHub:
##      gh secret set SONAR_TOKEN --body="<token>"
##   6. SonarCloud will use the organization slug it auto-generates — typically `udt1234`.
##      If different, update sonar.organization below.
##
## After setup, the GitHub Action in .github/workflows/sonarcloud.yml runs on every
## push to master and every PR. Findings show up as PR comments.

sonar.projectKey=udt1234_polymarket-trading-bot-3.21.26
sonar.organization=udt1234

# Display name shown in SonarCloud UI
sonar.projectName=PolyMarket Trading Bot

# Source code paths (everything under api/ + scripts/ + web/)
sonar.sources=api,scripts,web/app,web/lib,web/components

# Tests
sonar.tests=tests

# Exclusions — generated, cached, vendor, and one-off data dumps that
# aren't part of the production codebase.
sonar.exclusions=\
    **/node_modules/**,\
    **/__pycache__/**,\
    **/.next/**,\
    **/.venv/**,\
    **/venv/**,\
    **/_DataMetricPulls/**,\
    **/_downloads/**,\
    **/migrations/versions/**,\
    **/*.parquet,\
    **/*.csv,\
    **/.claude/**

# Don't analyze test files as duplication candidates against production code
sonar.cpd.exclusions=tests/**

# Language hints (auto-detection is fine but explicit is faster)
sonar.python.version=3.12
